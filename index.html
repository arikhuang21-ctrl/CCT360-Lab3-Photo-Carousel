<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Same Sky, Two Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>The Same Sky, Two Stories</h1>
    <p>The same three photos tell two different stories. Choose one, then use the buttons to move through it.</p>

    <div class="story-buttons">
      <button id="first-story" type="button">Farther Away</button>
      <button id="second-story" type="button">Finding Home</button>
    </div>

    <div class="carousel">
      <h2 id="story-title">Farther Away</h2>
      <p id="story-description">A journey from the familiar moon into a wider sky.</p>
      <p id="part">Beginning - 1 of 3</p>
      <img id="photo" src="images/moon.jpg" alt="A close view of the moon against a black sky">
      <p id="caption">The moon outside my window makes the night feel close.</p>

      <div class="photo-buttons">
        <button id="previous-photo" type="button">Previous</button>
        <button id="next-photo" type="button">Next</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
