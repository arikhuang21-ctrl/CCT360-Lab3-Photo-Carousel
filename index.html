<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Same Sky, Two Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>The Same Sky, Two Stories</h1>
    <p>Three photos, two different stories.</p>

    <div class="story-buttons">
      <button id="first-story" type="button">Farther Away</button>
      <button id="second-story" type="button">Finding Home</button>
    </div>

    <div class="carousel">
      <h2 id="story-title">Farther Away</h2>
      <p id="part">Beginning - 1 of 3</p>
      <img id="photo" src="images/moon.jpg" alt="The moon in a dark sky">
      <p id="caption">I start with the moon outside my window.</p>

      <div class="photo-buttons">
        <button id="previous-photo" type="button">Previous</button>
        <button id="next-photo" type="button">Next</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
